name: Build and deploy tagged file browser

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate files and generate index
        run: |
          python scripts/build_index.py entries index.json

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/files

          cp site/index.html _site/index.html
          cp site/filter.js _site/filter.js
          cp site/style.css _site/style.css
          cp index.json _site/index.json

          cp -R entries/. _site/files/

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref_name == github.event.repository.default_branch

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
